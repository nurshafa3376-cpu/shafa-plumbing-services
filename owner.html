<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Owner Access — Shafa Plumbing Services</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#01375B;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .card{background:#fff;color:#222;border-radius:14px;max-width:420px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .card img{width:150px;height:auto}
  h1{font-size:22px;margin:14px 0 8px;color:#01375B}
  p{font-size:15px;line-height:1.5;margin:8px 0;color:#444}
  a.btn{display:block;margin:20px 0 10px;background:#C8102E;color:#fff;text-decoration:none;font-weight:bold;font-size:18px;padding:16px 10px;border-radius:10px}
  .small{font-size:13px;color:#777}
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/logo.png" alt="Shafa Plumbing Services">
    <h1>Owner Access</h1>
    <p>This is a private page for the owner of Shafa Plumbing Services. Invoices are kept in a private account — they are not stored on this website.</p>
    <a class="btn" href="https://muse.ai" target="_top">Open My Invoice App</a>
    <p class="small">You will be asked to sign in to Muse. Only the signed-in owner can see the invoices. Then open <strong>Library → Invoice App</strong>.</p>
  </div>
</body>
</html>
