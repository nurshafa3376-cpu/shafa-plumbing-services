<!DOCTYPE html>
<html lang="en-CA">
<head>

<style>
:root{--navy:#01375B;--red:#C8102E;--gold:#E9B44C;--bg:#F2F5F8;--line:#D8E0E8;--txt:#1D2733;--mut:#5B6B7A}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff}
label{font-size:13px;font-weight:bold;color:var(--mut);display:block;margin:12px 0 5px}
.hidden{display:none!important}
/* login */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy)}
.login-card{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.login-card img{width:140px}
.login-card h1{color:var(--navy);font-size:22px;margin:12px 0 4px}
.login-card p{color:var(--mut);font-size:14px;margin:4px 0 10px}
.btn{display:block;width:100%;border:none;border-radius:10px;padding:15px;font-size:17px;font-weight:bold;margin-top:14px}
.btn-red{background:var(--red);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:#222}
.btn-ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.link{background:none;border:none;color:var(--navy);text-decoration:underline;font-size:14px;margin-top:10px}
.err{background:#FDECEC;color:#8B0000;border:1px solid #F3B8B8;padding:10px;border-radius:9px;font-size:14px;margin-top:12px;text-align:left}
.okmsg{background:#E8F6EC;color:#14532D;border:1px solid #A9D8B4;padding:10px;border-radius:9px;font-size:14px;margin-top:12px;text-align:left}
/* app shell */
header.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
header.top img{height:40px;background:#fff;border-radius:8px;padding:3px}
header.top .t{font-weight:bold;font-size:17px;flex:1}
header.top button{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:7px 10px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.summary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.summary .big{font-size:22px;font-weight:bold;color:var(--red)}
.summary .lbl{font-size:12px;color:var(--mut);font-weight:bold;text-transform:uppercase;letter-spacing:.4px}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{flex:1}
.yearhead{font-weight:bold;color:var(--navy);margin:18px 0 6px;display:flex;justify-content:space-between}
.docrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.docrow .nm{font-weight:bold;font-size:16px}
.docrow .sub{font-size:13px;color:var(--mut)}
.docrow .amt{font-weight:bold;font-size:16px;white-space:nowrap}
.badge{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:20px;color:#fff;display:inline-block;margin-top:4px}
.b-open{background:#2E7D32}.b-closed{background:#607D8B}.b-draft{background:#8D9EAD}.b-sent{background:#1565C0}.b-paid{background:#2E7D32}.b-overdue{background:var(--red)}
.fab{position:fixed;right:18px;bottom:24px;width:62px;height:62px;border-radius:50%;background:var(--red);color:#fff;font-size:34px;border:none;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:30;line-height:1}
nav.tabs{position:sticky;top:0;z-index:25;background:#fff;border-bottom:2px solid var(--line);display:flex;box-shadow:0 2px 8px rgba(0,0,0,.06)}
nav.tabs button{flex:1;background:#fff;border:none;border-bottom:4px solid var(--c,#999);padding:12px 2px 10px;font-size:13.5px;font-weight:bold;color:var(--c,#555)}
nav.tabs button.on{background:var(--c,#01375B);color:#fff}
/* editor */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;color:var(--navy);font-size:16px}
.segtabs{display:flex;gap:6px;margin-bottom:12px}
.segtabs button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:bold;color:var(--mut)}
.segtabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.itemrow{display:flex;gap:7px;margin-bottom:8px;align-items:flex-start}
.itemrow .d{flex:1}.itemrow .q{width:64px}.itemrow .r{width:96px}
.itemrow .del{width:42px;padding:11px 0;background:#FDECEC;border:1px solid #F3B8B8;border-radius:9px;color:#8B0000;font-weight:bold}
.totrow{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.totrow.grand{border-top:2px solid var(--navy);margin-top:6px;padding-top:10px;font-size:18px;font-weight:bold}
.totrow.due{color:var(--red);font-weight:bold;font-size:17px}
.rowflex{display:flex;gap:9px}.rowflex>div{flex:1}
.switchrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.switch{position:relative;width:54px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.switch .tr{position:absolute;inset:0;background:#B9C6D2;border-radius:20px;transition:.2s;pointer-events:none}
.switch .tr:after{content:"";position:absolute;width:24px;height:24px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.switch input:checked + .tr{background:var(--navy)}
.switch input:checked + .tr:after{left:27px}
.menu-list button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:16px;margin-bottom:8px}

/* preview doc */
.docpage{background:#fff;padding:26px 22px;border:1px solid var(--line);border-radius:6px}
.docpage .dhead{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:12px}

.docpage th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-size:13px}
.docpage td{padding:8px;border-bottom:1px solid var(--line);font-size:14px}
.docpage .r{text-align:right}
.docpage .terms{font-size:11.5px;color:#444;line-height:1.5;border-top:1px solid var(--line);padding-top:10px;margin-top:14px;white-space:pre-wrap}
@media print{
  body{background:#fff}
  header.top,nav.tabs,.fab,.no-print{display:none!important}
  main{padding:0;max-width:none}
  .docpage{border:none;border-radius:0}
  .print-only{display:block!important}
}
.print-only{display:none}

<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-card">
    <img src="/assets/logo.png" alt="Shafa Plumbing Services">

    <label style="text-align:left">Email</label>
    <input id="liEmail" type="email" autocomplete="username" value="nurshafa3376@gmail.com">
    <label style="text-align:left">Password</label>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const OWNER_EMAIL = "nurshafa3376@gmail.com";
const firebaseConfig = {
  apiKey: "AIzaSyCzz9ZA7ZLDPf_5tdmaqfFqX4qK3lxcpdE",
  authDomain: "shafa-invoice.firebaseapp.com",
  projectId: "shafa-invoice",
  storageBucket: "shafa-invoice.firebasestorage.app",
  messagingSenderId: "166541457033",
  appId: "1:166541457033:web:22d9b64ff098e32298b858"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- DIRECT EMAIL SEND — CONFIG ----------
   "Send by Email" can send DIRECTLY from this app through a small
   Google Apps Script relay that runs under the owner's own Google
   account (see direct-email/DEPLOY-STEPS.md and apps-script.gs).
   After that relay is deployed, paste its web-app URL and the shared
   secret token here. While the URL/token below are still placeholders,
   directSendReady() is false and "Send by Email" keeps the OLD
   behaviour (opens your own mail app) — nothing breaks. */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxyFTS0bTealC7aqjgbuwjTDP80f8XIiDcn0LWvkqLJUkt3MhHi7_9hvY9Q_C9-bWUjKg/exec";
const APPS_SCRIPT_TOKEN = "809ca534992975b1f69ab5d4abf0847b57b4cb750b9391a5";

const $ = s => document.querySelector(s);
const money = n => "$" + (Math.round((+n||0)*100)/100).toLocaleString("en-CA",{minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = (d=new Date()) => d.toISOString().slice(0,10);
const addDays = (ds, n) => { const d = new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fmtDate = ds => ds ? new Date(ds+"T12:00:00").toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}) : "";

const GUARANTEE = "The Guarantee shall be for labour only in respect of faulty workmanship for 12 months from the date of completion with the manufacturers warranty in force. The Guarantee will become null & void if the work/appliance completed/supplied by the Company is: (a) Subject to misuse or negligence. (b) Repaired, modified or tampered with by anyone other than a Company operative. The Company will accept no liability for, or guarantee suitability, materials supplied by the Customer & will accept no liability for any consequential damage or fault. The company will not guarantee any work in respect of blockages in waste & drainage systems etc. Work is guaranteed only in respect of work directly undertaken by the company & payment in fully has been made.";
const DEFAULT_SETTINGS = {
  bizName: "Shafa Plumbing Services",
  bizAddr: "106 Cleta Dr, Scarborough, ON M1K 3G7",
  bizPhone: "647-710-3376",
  bizEmail: "nurshafa3376@gmail.com",
  bizWeb: "www.shafaplumbing.ca",
  bizLicence: "Licence No. P34765",
  taxRate: 13,
  guarantee: GUARANTEE,
  payLine: "We accept cash, debit, credit cards and e-transfer.",
  invSeq: 0, estSeq: 0
};
const SEED_ITEMS = [
  {name:"Drain Snaking", price:250}, {name:"Toilet Installation & Drain Snaking", price:250},
  {name:"Shower Head Installation", price:99}, {name:"Hot Water Tank Installation (labour)", price:490},
  {name:"Toilet Supply (Glacier Bay)", price:249}, {name:"Sump Pump Installation", price:0},
  {name:"Water Heater Installation", price:0}, {name:"Emergency Call", price:0}
];

let S = { settings:null, clients:[], items:[], docs:[], expenses:[], payments:[], tab:"invoices", view:"list", editId:null, editSeg:"edit", search:"", clientSearch:"", clientId:null };

/* ---------- AUTH ---------- */
function liMsg(err, ok){
  $("#liErr").classList.toggle("hidden", !err); $("#liErr").textContent = err||"";
  $("#liOk").classList.toggle("hidden", !ok); $("#liOk").textContent = ok||"";
}
function authErr(e){
  const m = {"auth/invalid-credential":"Wrong email or password.","auth/user-not-found":"No account with that email yet — use 'Create owner account' the first time.","auth/wrong-password":"Wrong password.","auth/email-already-in-use":"That account already exists — just sign in.","auth/weak-password":"Password is too weak — use at least 6 characters.","auth/invalid-email":"That email doesn't look right.","auth/too-many-requests":"Too many tries — wait a few minutes."}[e.code] || ("Something went wrong: " + e.message);
  return m;
}
$("#btnLogin").onclick = async () => {
  liMsg("",""); 
  try { await signInWithEmailAndPassword(auth, $("#liEmail").value.trim(), $("#liPass").value); }
  catch(e){ liMsg(authErr(e),""); }
};
$("#btnSignup").onclick = async () => {
  liMsg("","");
  const em = $("#liEmail").value.trim();
  if (em.toLowerCase() !== OWNER_EMAIL) { liMsg("Only the owner's email ("+OWNER_EMAIL+") can create the account.",""); return; }
  try { await createUserWithEmailAndPassword(auth, em, $("#liPass").value); }
  catch(e){ liMsg(authErr(e),""); }
};
$("#btnForgot").onclick = async () => {
  liMsg("","");
  try { await sendPasswordResetEmail(auth, $("#liEmail").value.trim()); liMsg("", "Password reset email sent — check your inbox."); }
  catch(e){ liMsg(authErr(e),""); }
};
$("#btnLogout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (!user) { $("#appView").classList.add("hidden"); $("#loginView").classList.remove("hidden"); return; }
  if (user.email.toLowerCase() !== OWNER_EMAIL) { await signOut(auth); liMsg("That account is not the owner account. Your invoices stay locked to "+OWNER_EMAIL+".",""); return; }
  $("#loginView").classList.add("hidden"); $("#appView").classList.remove("hidden");
  await loadAll();
  render();
});

async function loadAll(){
  const sref = doc(db,"settings","main");
  const ss = await getDoc(sref);
  if (!ss.exists()) { await setDoc(sref, DEFAULT_SETTINGS); S.settings = {...DEFAULT_SETTINGS}; }
  else S.settings = {...DEFAULT_SETTINGS, ...ss.data()};
  const itemsSnap = await getDocs(collection(db,"items"));
  if (itemsSnap.empty) { for (const it of SEED_ITEMS) await addDoc(collection(db,"items"), it); }
  onSnapshot(collection(db,"clients"), sn => { S.clients = sn.docs.map(d=>({id:d.id,...d.data()})); if(!$("#appView").classList.contains("hidden")) render(); });
  onSnapshot(collection(db,"items"), sn => { S.items = sn.docs.map(d=>({id:d.id,...d.data()})); });
  onSnapshot(collection(db,"documents"), sn => { S.docs = sn.docs.map(d=>({id:d.id,...d.data()})); if(S.view==="list") render(); });
  onSnapshot(collection(db,"expenses"), sn => { S.expenses = sn.docs.map(d=>({id:d.id,...d.data()})); if(S.view==="list"&&(S.tab==="expenses")) render(); });
  onSnapshot(collection(db,"payments"), sn => { S.payments = sn.docs.map(d=>({id:d.id,...d.data()})); if(S.view==="list"&&(S.tab==="payments")) render(); });
}

/* ---------- CALCS ---------- */
function totals(d){
  const sub = (d.items||[]).reduce((a,i)=> a + (+i.qty||0)*(+i.rate||0), 0);
  let disc = 0;
  if (d.discount) disc = d.discount.type === "pct" ? sub * (+d.discount.value||0)/100 : (+d.discount.value||0);
  const taxable = Math.max(0, sub - disc);
  const rate = d.taxOff ? 0 : (S.settings.taxRate||13);
  const tax = taxable * rate/100;
  const total = taxable + tax;
  const paid = S.payments.filter(p=>p.docId===d.id).reduce((a,p)=>a+(+p.amount||0),0);
  return { sub, disc, tax, total, paid, rate, balance: Math.max(0, total - paid) };
}
function docStatus(d){
  if (d.type==="estimate") return d.status==="closed" ? "Closed" : "Open";
  const t = totals(d);
  if (t.total>0 && t.balance<=0) return "Paid";
  if (d.dueDate && d.dueDate < todayStr() && t.balance>0) return "Overdue";
  return d.status==="sent" ? "Sent" : "Draft";
}
const badgeCls = s => ({"Open":"b-open","Closed":"b-closed","Draft":"b-draft","Sent":"b-sent","Paid":"b-paid","Overdue":"b-overdue"}[s]||"b-draft");

/* ---------- DIRECT EMAIL SEND (Apps Script relay) ---------- */
function directSendReady(){
  return /^https:\/\/script\.google\.com\//.test(APPS_SCRIPT_URL||"")
    && !!APPS_SCRIPT_TOKEN && APPS_SCRIPT_TOKEN !== "TOKEN_NOT_SET";
}
function docEmailPayload(){
  const d = E, st = S.settings, t = totals({...E, id:S.editId});
  const items = (d.items||[]).filter(i=>i.desc||i.rate)
    .map(i=>({desc:i.desc||"", qty:+i.qty||0, rate:+i.rate||0, amount:(+i.qty||0)*(+i.rate||0)}));
  return {
    token: APPS_SCRIPT_TOKEN,
    to: (d.clientEmail||"").trim(),
    subject: `${st.bizName} — ${d.type==="invoice"?"Invoice":"Estimate"} ${d.number}`,
    docType: d.type, number: d.number, date: d.date||"", dueDate: d.dueDate||"", terms: d.terms||"",
    clientName: d.clientName||"", clientAddr: d.clientAddr||"", clientPhone: d.clientPhone||"", clientEmail: d.clientEmail||"",
    items,
    subtotal: t.sub, discount: t.disc, taxRate: t.rate, tax: t.tax, total: t.total, paid: t.paid, balance: t.balance,
    deposit: (d.deposit && d.deposit.enabled) ? (+d.deposit.value||0) : 0,
    notes: d.notes||"", payLine: st.payLine||"", guarantee: st.guarantee||"",
    bizName: st.bizName||"", bizAddr: st.bizAddr||"", bizPhone: st.bizPhone||"",
    bizEmail: st.bizEmail||"", bizWeb: st.bizWeb||"", bizLicence: st.bizLicence||""
  };
}
/* Sends the current document by email through the relay. On ANY failure
   (or when the relay is not configured yet) it falls back to the old
   behaviour via mailtoFallback() — opening the owner's mail app. */
async function sendDocEmail(btn, mailtoFallback){
  if (!directSendReady()) { mailtoFallback(); return; }
  if (!E.clientEmail || !/^\S+@\S+\.\S+$/.test(E.clientEmail.trim())) {
    alert("Add the client's email address first (in the Client section), then tap Send by Email again.");
    return;
  }
  const oldLabel = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Sending…"; }
  try {
    // text/plain keeps this a CORS "simple request" (no preflight) —
    // Apps Script web apps cannot answer an OPTIONS preflight.
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(docEmailPayload())
    });
    const data = JSON.parse(await res.text());
    if (!data || data.ok !== true) throw new Error((data && data.error) || "send_failed");
    // Record the send on the document itself.
    const patch = { sentAt: Date.now(), sentTo: E.clientEmail };
    if (E.type==="invoice" && E.status==="draft") {
      patch.status = "sent"; E.status = "sent";
      const fs = $("#fStatus"); if (fs) fs.value = "sent";
    }
    E.sentAt = patch.sentAt; E.sentTo = patch.sentTo;
    await updateDoc(doc(db,"documents", S.editId), patch);
    if (btn) btn.textContent = "✅ Sent by email";
    alert("Email sent to " + E.clientEmail + " — the " + (E.type==="invoice"?"invoice":"estimate") + " is attached as a PDF.");
  } catch(err) {
    if (btn) { btn.disabled = false; btn.textContent = oldLabel; }
    alert("Direct send didn't go through — opening your email app instead, like before.");
    mailtoFallback();
  }
}

/* ---------- SMART HELPERS (reviews, price memory) ---------- */
const REVIEW_LINK = "https://g.page/r/CdxyuRv3Ga37EAI/review";
function waNum(phone){ let p = (phone||"").replace(/\D/g,""); if (p.length===10) p = "1"+p; return p; }
function askReview(name, phone){
  const p = waNum(phone);
  const msg = `Hi ${name||"there"}, thank you for choosing ${S.settings.bizName}! If you were happy with our work, we'd really appreciate a quick Google review — it helps our small business a lot:\n${REVIEW_LINK}`;
  if (p) window.open("https://wa.me/"+p+"?text="+encodeURIComponent(msg), "_blank");
  else { if (navigator.clipboard) navigator.clipboard.writeText(REVIEW_LINK).catch(()=>{}); alert("No phone number saved for this client, so WhatsApp can't open. The review link is:\n"+REVIEW_LINK+"\n(It has been copied — paste it into a text or email.)"); }
}
function priceMap(){
  const m = new Map();
  const put = (desc, rate) => { const d = (desc||"").trim(); if (d && (+rate||0)>0) m.set(d.toLowerCase(), {desc:d, rate:+rate}); };
  const jobs = [];
  for (const c of S.clients) for (const j of (c.sqHistory||[])) jobs.push(j);
  jobs.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  for (const j of jobs) put(j.desc, j.amount);
  const docs = [...S.docs].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  for (const d of docs) for (const i of (d.items||[])) put(i.desc, i.rate);
  for (const i of S.items) put(i.name, i.price);
  return m;
}
let sugInput = null, sugMatches = [];
function hideSug(){ const s = $("#descSug"); if (s) s.classList.add("hidden"); }
function showSug(inp){
  const sug = $("#descSug"); if (!sug) return;
  const q = (inp.value||"").trim().toLowerCase();
  if (q.length < 2) { hideSug(); return; }
  sugMatches = [...priceMap().values()].filter(x => x.desc.toLowerCase().includes(q)).slice(-8).reverse();
  if (!sugMatches.length) { hideSug(); return; }
  sugInput = inp;
  const r = inp.getBoundingClientRect();
  sug.style.left = (r.left + window.scrollX) + "px";
  sug.style.top = (r.bottom + window.scrollY + 2) + "px";
  sug.style.width = r.width + "px";
  sug.innerHTML = sugMatches.map((x,ix)=>`<div data-sug="${ix}" style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)"><strong>${esc(x.desc)}</strong><span style="float:right;font-weight:bold">${money(x.rate)}</span><div class="small">last price used</div></div>`).join("");
  sug.classList.remove("hidden");
  sug.querySelectorAll("[data-sug]").forEach(el => el.onmousedown = ev => {
    ev.preventDefault();
    const pick = sugMatches[+el.dataset.sug]; if (!pick || !sugInput) return;
    const ix = +sugInput.dataset.ix;
    E.items[ix].desc = pick.desc; E.items[ix].rate = pick.rate;
    hideSug(); drawItemRows(); refreshTotals();
  });
}
document.addEventListener("click", e => { const s = $("#descSug"); if (s && !s.contains(e.target) && !(e.target.dataset && e.target.dataset.f==="desc")) s.classList.add("hidden"); });

function render(){

  $("#hdrTitle").textContent = {invoices:"Invoices",estimates:"Estimates",expenses:"Expenses",payments:"Payments",more:"More"}[S.tab];
  fab.classList.toggle("hidden", !(S.view==="list" && ["invoices","estimates","expenses"].includes(S.tab)));
  if (S.view==="editor") return renderEditor();
  if (S.view==="clients") return renderClients();
  if (S.view==="client") return renderClientDetail();
  if (S.view==="owed") return renderOwed();
  if (S.view==="tankdue") return renderTankDue();

function renderDocList(type){
  let docs = S.docs.filter(d=>d.type===type);
  const owed = type==="invoice" ? docs.reduce((a,d)=>a+totals(d).balance,0) : docs.reduce((a,d)=>a+totals(d).total,0);
  const overdueN = type==="invoice" ? docs.filter(d=>docStatus(d)==="Overdue").length : 0;
  const yr = new Date().getFullYear();
  const yrTotal = docs.filter(d=>(d.date||"").startsWith(yr)).reduce((a,d)=>a+totals(d).total,0);
  if (S.search) { const q = S.search.toLowerCase(); const qd = S.search.replace(/\D/g,""); docs = docs.filter(d => (d.clientName||"").toLowerCase().includes(q) || (d.number||"").toLowerCase().includes(q) || (qd.length>=3 && (d.clientPhone||"").replace(/\D/g,"").includes(qd))); }
  docs.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.number||"").localeCompare(a.number||""));
  if (type==="invoice") docs.sort((a,b)=> (docStatus(a)==="Overdue"?0:1) - (docStatus(b)==="Overdue"?0:1) || (b.date||"").localeCompare(a.date||""));
  const custMatches = S.search ? S.clients.filter(c => clientMatches(c, S.search)).sort((a,b)=>(a.name||"").localeCompare(b.name||"")) : [];
  const years = [...new Set(docs.map(d=>(d.date||yr+"").slice(0,4)))];
  let h = type==="invoice"
    ? `<div class="summary" id="owedCard" style="cursor:pointer"><div><div class="lbl">Owed to you</div><div class="big">${money(owed)}</div><div class="small" style="margin-top:3px">${overdueN} overdue · tap to see who owes you →</div></div><div style="text-align:right"><div class="lbl">${yr} total</div><div style="font-weight:bold">${money(yrTotal)}</div></div></div>`
    : `<div class="summary"><div><div class="lbl">Open estimates</div><div class="big">${money(owed)}</div></div><div style="text-align:right"><div class="lbl">${yr} total</div><div style="font-weight:bold">${money(yrTotal)}</div></div></div>`;
  h += `<div class="searchrow"><input id="q" placeholder="Search name, phone or number" value="${esc(S.search)}"></div>`;
  if (custMatches.length){
    h += `<div class="yearhead"><span>Customers</span><span></span></div>`;
    for (const c of custMatches.slice(0,10))
      h += `<div class="docrow"><div data-copen="${c.id}" style="flex:1;cursor:pointer"><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.phone||"")} ${esc(clientAddr(c))}</div></div></div>`;
    if (custMatches.length>10) h += `<div style="text-align:center;padding:8px"><span class="small">…and ${custMatches.length-10} more — search in More → Clients</span></div>`;
  }
  if (!docs.length) h += `<div class="card" style="text-align:center;padding:30px"><p>No ${type}s yet.</p><p class="small">Tap the red + button to make your first one.</p></div>`;
  for (const y of years){
    const yd = docs.filter(d=>(d.date||"").slice(0,4)===y);
    h += `<div class="yearhead"><span>${y}</span><span>${money(yd.reduce((a,d)=>a+totals(d).total,0))}</span></div>`;
    for (const d of yd){
      const t = totals(d), st = docStatus(d);
      h += `<div class="docrow" data-open="${d.id}"><div><div class="nm">${esc(d.clientName||"No client")}</div><div class="sub">${esc(d.number)} · ${fmtDate(d.date)}</div><span class="badge ${badgeCls(st)}">${st}</span></div><div class="amt">${money(t.total)}${t.balance>0&&t.balance<t.total?`<div class="sub" style="color:var(--red)">Bal ${money(t.balance)}</div>`:""}</div></div>`;
    }
  }
  main.innerHTML = h;
  $("#q").oninput = e => { S.search = e.target.value; renderDocList(type); const q=$("#q"); q.focus(); q.setSelectionRange(q.value.length,q.value.length); };
  main.querySelectorAll("[data-open]").forEach(el => el.onclick = () => { S.editId = el.dataset.open; S.view="editor"; S.editSeg="edit"; render(); });
  const oc = $("#owedCard"); if (oc) oc.onclick = () => { S.view="owed"; render(); };
  wireClientOpen();
}

function renderOwed(){
  const invs = S.docs.filter(d=>d.type==="invoice").map(d=>({d, t:totals(d)})).filter(x=>x.t.balance>0);
  invs.sort((a,b)=> (docStatus(a.d)==="Overdue"?0:1) - (docStatus(b.d)==="Overdue"?0:1) || (a.d.dueDate||"").localeCompare(b.d.dueDate||""));
  const total = invs.reduce((a,x)=>a+x.t.balance,0);
  let h = `<button class="btn-ghost btn" style="width:auto;padding:9px 16px;margin:0 0 12px" id="backBtn">← Back to Invoices</button>
  <div class="summary"><div><div class="lbl">Total owed to you</div><div class="big">${money(total)}</div></div><div style="text-align:right"><div class="lbl">Invoices owing</div><div style="font-weight:bold">${invs.length}</div></div></div>`;
  if (!invs.length) h += `<div class="card" style="text-align:center;padding:24px"><p>Nobody owes you anything right now. 🎉</p></div>`;
  const groups = new Map();
  for (const x of invs){
    const key = x.d.clientId || (x.d.clientName||"").toLowerCase();
    if (!groups.has(key)) groups.set(key, {name:x.d.clientName||"No client", phone:x.d.clientPhone||"", rows:[]});
    const g = groups.get(key); g.rows.push(x); if (!g.phone && x.d.clientPhone) g.phone = x.d.clientPhone;
  }
  for (const g of groups.values()){
    const gbal = g.rows.reduce((a,x)=>a+x.t.balance,0);
    h += `<div class="yearhead"><span>${esc(g.name)}</span><span>${money(gbal)}</span></div>`;
    for (const x of g.rows){
      const st = docStatus(x.d);
      const phone = x.d.clientPhone || g.phone || (S.clients.find(c=>c.id===x.d.clientId)||{}).phone || "";
      h += `<div class="docrow"><div style="flex:1"><div class="nm">${esc(x.d.number||"")}</div><div class="sub">${fmtDate(x.d.date)} · due ${fmtDate(x.d.dueDate)}</div><span class="badge ${badgeCls(st)}">${st}</span></div><div style="text-align:right"><div class="amt">${money(x.t.balance)}</div>${phone?`<button data-remind="${x.d.id}" style="margin-top:6px;padding:7px 10px;background:#fff;border:1px solid #2E7D32;border-radius:8px;color:#2E7D32;font-weight:bold;font-size:12.5px">💬 Remind</button>`:""}</div></div>`;
    }
  }
  main.innerHTML = h;
  $("#backBtn").onclick = () => { S.view="list"; S.tab="invoices"; render(); };
  main.querySelectorAll("[data-remind]").forEach(b => b.onclick = () => {
    const d = S.docs.find(x=>x.id===b.dataset.remind); if (!d) return;
    const t = totals(d);
    const cl = S.clients.find(c=>c.id===d.clientId);
    const p = waNum(d.clientPhone || (cl ? cl.phone : ""));
    if (!p) return;
    const msg = `Hi ${d.clientName||"there"}, a friendly reminder from ${S.settings.bizName}: invoice ${d.number} has a balance of ${money(t.balance)} outstanding. We accept cash, debit, credit cards and e-transfer. If you've already paid, please ignore this message. Questions? Call/WhatsApp ${S.settings.bizPhone}. Thank you!`;
    window.open("https://wa.me/"+p+"?text="+encodeURIComponent(msg), "_blank");
  });
}

function renderTankDue(){
  const KW = ["tank","water heater","flush","t&p","relief valve","anode"];
  const isTank = s => { const v = (s||"").toLowerCase(); return KW.some(k=>v.includes(k)); };
  const today = new Date(todayStr()+"T12:00:00");
  const rows = [];
  for (const c of S.clients){
    let last = "";
    const nameLc = (c.name||"").toLowerCase();
    for (const d of S.docs){
      if (d.clientId===c.id || (!d.clientId && nameLc && (d.clientName||"").toLowerCase()===nameLc))
        if ((d.items||[]).some(i=>isTank(i.desc)) && (d.date||"")>last) last = d.date;
    }
    for (const j of (c.sqHistory||[])) if (isTank(j.desc) && (j.date||"")>last) last = j.date;
    if (!last) continue;
    const age = Math.round((today - new Date(last+"T12:00:00"))/86400000);
    if (age>=335 && age<=730) rows.push({c, last, age});
  }
  rows.sort((a,b)=> b.age - a.age);
  let h = `<button class="btn-ghost btn" style="width:auto;padding:9px 16px;margin:0 0 12px" id="backBtn">← Back</button>
  <div class="yearhead"><span>Due for tank service</span><span>${rows.length} customer${rows.length===1?"":"s"}</span></div>`;
  if (!rows.length) h += `<div class="card" style="text-align:center;padding:24px"><p>Nobody due yet.</p><p class="small">Customers appear here about 11 months after a tank or water-heater service job.</p></div>`;
  for (const r of rows){
    const digits = (r.c.phone||"").replace(/\D/g,"");
    let wa = digits; if (wa.length===10) wa = "1"+wa;
    h += `<div class="docrow"><div style="flex:1"><div class="nm">${esc(r.c.name||"")}</div><div class="sub">Last tank service: ${fmtDate(r.last)} · ${r.age} days ago</div></div><div style="display:flex;gap:6px">${r.c.phone?`<a class="btn btn-navy" style="width:auto;margin-top:0;padding:10px 12px;text-align:center;text-decoration:none" href="tel:${esc(digits)}">📞 Call</a>`:""}${digits?`<a class="btn btn-navy" style="width:auto;margin-top:0;padding:10px 12px;text-align:center;text-decoration:none" href="https://wa.me/${wa}" target="_blank">💬 WhatsApp</a>`:""}</div></div>`;
  }
  main.innerHTML = h;
  $("#backBtn").onclick = () => { S.view="list"; render(); };
}

function renderMore(){
  main.innerHTML = `<div class="menu-list">
    <button data-m="clients">👤 Clients</button>
    <button data-m="items">🧰 My services & prices</button>
    <button data-m="settings">⚙️ Business info & guarantee text</button>
    <button data-m="backup">⬇️ Backup my data (download file)</button>
    <button data-m="restore">⬆️ Restore from backup file</button>
    <button data-m="import">📥 Import an estimate / invoice (prepared file)</button>
    <button data-m="history">📥 Import Square job history (prepared file)</button>
    <button data-m="tankdue">🔧 Due for tank service</button>
    <input type="file" id="restoreFile" accept=".json" style="display:block;margin:10px 0">
    <input type="file" id="impFile" accept=".json" style="display:block;margin:10px 0">
    <input type="file" id="histFile" accept=".json" style="display:block;margin:10px 0">
    <div class="card"><h3>How your app is protected</h3><p class="small">Only the signed-in owner account (${esc(OWNER_EMAIL)}) can open this app or read its data. The database rules enforce the same lock. Your data syncs between your phone and computer automatically.</p></div>
  </div>`;
  main.querySelectorAll("[data-m]").forEach(b => b.onclick = async () => {
    const m = b.dataset.m;
    if (m==="clients"){ S.view="clients"; render(); }
    if (m==="items"){ S.view="items"; render(); }
    if (m==="tankdue"){ S.view="tankdue"; render(); }
    if (m==="settings"){ S.view="settings"; render(); }
    if (m==="backup"){
      const data = {settings:S.settings, clients:S.clients, items:S.items, documents:S.docs, expenses:S.expenses, payments:S.payments};
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})); a.download = "shafa-invoice-backup-"+todayStr()+".json"; a.click();
    }
    if (m==="restore"){ const rf = $("#restoreFile"); if (rf.files && rf.files.length) { doRestore(rf.files[0]); } else { rf.click(); } }
    if (m==="import"){ $("#impFile").click(); }
    if (m==="history"){ const hf = $("#histFile"); if (hf.files && hf.files.length) { doHistoryImport(hf.files[0]); } else { hf.click(); } }
  });
  $("#impFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.kind !== "shafa-doc-import" || !data.doc) { alert("This file is not a Shafa document import."); return; }
      const cd = data.client || {};
      let client = S.clients.find(c => c.name === cd.name && (c.phone||"") === (cd.phone||""));
      let clientId = client ? client.id : "";
      if (!client) {
        const ref = await addDoc(collection(db,"clients"), { name: cd.name||"Client", phone: cd.phone||"", email: cd.email||"", addr: cd.addr||"" });
        clientId = ref.id;
      }
      const type = data.doc.type === "invoice" ? "invoice" : "estimate";
      const num = await nextNumber(type);
      await addDoc(collection(db,"documents"), {
        type, number: num, date: todayStr(), terms: type==="invoice" ? "48h" : "30", dueDate: addDays(todayStr(), type==="invoice" ? 2 : 30),
        clientId, clientName: cd.name||"", clientPhone: cd.phone||"", clientEmail: cd.email||"", clientAddr: cd.addr||"",
        items: (data.doc.items||[]).map(it => ({ desc: it.desc||it.name||"", qty: +it.qty||1, rate: (it.rate!=null? +it.rate : +it.price)||0 })),
        discount: { type:"amt", value:0 }, taxOff: data.doc.taxRate === 0,
        deposit: { enabled:false, value:0 }, notes: data.doc.notes||"", status: type==="invoice" ? "draft" : "open", sigLine: false, photos: [], createdAt: Date.now()
      });
      alert("Imported ✓ " + num + " for " + (cd.name||"client") + " — find it in your " + (type==="invoice" ? "Invoices" : "Estimates") + " tab.");
      S.tab = type==="invoice" ? "invoices" : "estimates"; S.view = "list"; render();
    } catch(err) { alert("Import failed: " + err.message); }
    e.target.value = "";
  };
  async function doRestore(f){
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      let added = 0, skipped = 0, failed = 0;
      const keyOf = c => ((c.email||"").trim().toLowerCase()) || (((c.name||"").trim().toLowerCase()) + "|" + ((c.phone||"").replace(/\D/g,"")));
      const seen = new Set(S.clients.map(keyOf));
      for (const c of (data.clients||[])) { const {id, ...rest} = c; const k = keyOf(rest); if (seen.has(k)) { skipped++; continue; } try { await addDoc(collection(db,"clients"), rest); seen.add(k); added++; } catch(err) { failed++; } }
      for (const d of (data.documents||[])) { const {id, ...rest} = d; await addDoc(collection(db,"documents"), rest); }
      for (const x of (data.expenses||[])) { const {id, ...rest} = x; await addDoc(collection(db,"expenses"), rest); }
      for (const p of (data.payments||[])) { const {id, ...rest} = p; await addDoc(collection(db,"payments"), rest); }
      alert("Restore done. Clients added: " + added + (skipped ? " · already in app, skipped: " + skipped : "") + (failed ? " · failed: " + failed : ""));
    } catch(err) { alert("Restore failed: " + err.message); }
    $("#restoreFile").value = "";
  }
  $("#restoreFile").onchange = e => { const f = e.target.files[0]; if (f) doRestore(f); };
  async function doHistoryImport(f){
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.kind !== "shafa-history-import" || !Array.isArray(data.entries)) { alert("This file is not a Shafa Square history import."); return; }
      const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
      const digits = s => { const d = String(s||"").replace(/\D/g,""); return d.length>=10 ? d.slice(-10) : d; };
      let matched = 0, unmatched = 0, added = 0, dupes = 0; const missed = [];
      for (const e of data.entries) {
        const ids = e.squareIds || (e.squareId ? [e.squareId] : []);
        let client = S.clients.find(c => c.sqId && ids.includes(c.sqId));
        if (!client && e.name && digits(e.phone)) client = S.clients.find(c => norm(c.name)===norm(e.name) && digits(c.phone) && digits(c.phone)===digits(e.phone));
        if (!client && e.name && e.email) client = S.clients.find(c => norm(c.name)===norm(e.name) && (c.email||"").toLowerCase()===(e.email||"").toLowerCase());
        if (!client && e.email) { const m = S.clients.filter(c => (c.email||"").toLowerCase()===(e.email||"").toLowerCase()); if (m.length===1) client = m[0]; }
        if (!client && digits(e.phone)) { const m = S.clients.filter(c => digits(c.phone) && digits(c.phone)===digits(e.phone)); if (m.length===1) client = m[0]; }
        if (!client) { unmatched++; if (e.name) missed.push(e.name); continue; }
        matched++;
        const cur = Array.isArray(client.sqHistory) ? [...client.sqHistory] : [];
        const keyOf = j => (j.date||"")+"|"+(+j.amount||0)+"|"+(j.desc||"");
        const seen = new Set(cur.map(keyOf));
        let changed = false;
        for (const j of (e.jobs||[])) {
          const job = {date: j.date||"", desc: j.desc||"", amount: +j.amount||0};
          if (seen.has(keyOf(job))) { dupes++; continue; }
          seen.add(keyOf(job)); cur.push(job); added++; changed = true;
        }
        if (changed) { cur.sort((a,b)=>(a.date||"").localeCompare(b.date||"")); await updateDoc(doc(db,"clients", client.id), {sqHistory: cur}); client.sqHistory = cur; }
      }
      alert("Square history import done.\nCustomers matched: " + matched + "\nJobs added: " + added + (dupes ? "\nAlready there, skipped: " + dupes : "") + "\nNot matched: " + unmatched + (missed.length ? "\nNo match for: " + missed.slice(0,5).join(", ") + (missed.length>5 ? "…" : "") : ""));
    } catch(err) { alert("History import failed: " + err.message); }
    $("#histFile").value = "";
  }
  $("#histFile").onchange = e => { const f = e.target.files[0]; if (f) doHistoryImport(f); };
}

let E = null; // working copy
async function nextNumber(type){
  const key = type==="invoice" ? "invSeq" : "estSeq";
  const n = (S.settings[key]||0) + 1;
  S.settings[key] = n;

function compressPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1000, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      let q = 0.72, out = cv.toDataURL("image/jpeg", q);
      while (out.length > 340000 && q > 0.4) { q -= 0.12; out = cv.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(img.src); res(out);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

    <p style="margin:14px 0 0"><strong>To:</strong> ${esc(d.clientName||"")}${d.clientAddr? "<br><span class='small'>"+esc(d.clientAddr)+"</span>":""}${d.clientPhone? "<br><span class='small'>"+esc(d.clientPhone)+"</span>":""}${d.clientEmail? "<br><span class='small'>"+esc(d.clientEmail)+"</span>":""}</p>
    <table><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr>
    ${(d.items||[]).filter(i=>i.desc||i.rate).map(i=>`<tr><td>${esc(i.desc)}</td><td class="r">${i.qty}</td><td class="r">${money(i.rate)}</td><td class="r">${money((+i.qty||0)*(+i.rate||0))}</td></tr>`).join("")}
    </table>
    <div style="max-width:300px;margin-left:auto">${totalsHTML(t)}</div>
    ${d.deposit&&d.deposit.enabled?`<p><strong>Deposit requested: ${money(d.deposit.value)}</strong></p>`:""}
    <p><strong>${termsLine}</strong><br>${esc(st.payLine)}</p>
    ${d.notes?`<p><strong>Notes:</strong> ${esc(d.notes)}</p>`:""}
    ${(d.photos&&d.photos.length)?`<div style="margin-top:12px"><strong>Job photos:</strong><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${d.photos.map(p=>`<img src="${esc(p.url)}" style="width:31%;border:1px solid var(--line);border-radius:6px">`).join("")}</div></div>`:""}
    ${d.sigLine?`<div style="margin-top:26px;display:flex;gap:30px"><div style="flex:1;border-top:1px solid #333;padding-top:5px" class="small">Client signature</div><div style="flex:1;border-top:1px solid #333;padding-top:5px" class="small">Date</div></div>`:""}
    <div class="terms"><strong>Guarantee:</strong> ${esc(st.guarantee)}</div>
    <p style="margin-top:16px">Thank you for your business.<br>— ${esc(st.bizName)}</p>
  </div>`;
}

function historyHTML(d, t){
  const pays = S.payments.filter(p=>p.docId===d.id).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let run = 0;
  const rows = pays.map(p=>{ run += (+p.amount||0); const bal = Math.max(0, t.total - run); return `<div class="totrow"><span>${fmtDate(p.date)} · ${esc(p.method)}${bal>0?" (partial)":""}</span><span>${money(p.amount)} → balance ${money(bal)}</span></div>`; }).join("");
  let h = `<div class="card"><h3>Payments on ${esc(d.number)}</h3>
    <div class="totrow"><span>Total</span><span>${money(t.total)}</span></div>
    <div class="totrow"><span>Paid</span><span>${money(t.paid)}</span></div>
    <div class="totrow due"><span>Balance Due</span><span>${money(t.balance)}</span></div>
    ${rows || '<p class="small">No payments yet.</p>'}
  </div>`;
  if (d.type==="invoice" || d.type==="estimate") h += `<div class="card"><h3>Record a payment</h3>
    <label>Amount $ — full or partial (part payments are fine, the rest stays as Balance Due)</label><input type="number" id="pAmt" step="0.01" min="0" value="${t.balance>0?t.balance.toFixed(2):""}">
    <label>Method</label><select id="pMethod"><option>Cash</option><option>Debit</option><option>Credit Card</option><option>E-Transfer</option><option>Cheque</option></select>
    <label>Date</label><input type="date" id="pDate" value="${todayStr()}">
    <button class="btn btn-red" id="pSave">Save Payment</button></div>`;
  return h;
}
function bindHistory(d){
  const b = $("#pSave"); if (!b) return;
  b.onclick = async () => {
    const amt = +$("#pAmt").value||0; if (amt<=0) { alert("Enter an amount."); return; }
    await addDoc(collection(db,"payments"), {docId:d.id, clientName:d.clientName||"", amount:amt, method:$("#pMethod").value, date:$("#pDate").value||todayStr()});
    renderEditor();
  };
}

/* ---------- CLIENTS / ITEMS / SETTINGS / EXPENSES ---------- */
function clientAddr(c){ return c.address || c.addr || ""; }
function clientMatches(c, query){
  const q = (query||"").toLowerCase(), qd = (query||"").replace(/\D/g,"");
  if (!q) return false;
  return (c.name||"").toLowerCase().includes(q) || (c.email||"").toLowerCase().includes(q) || (c.address||"").toLowerCase().includes(q) || (c.addr||"").toLowerCase().includes(q) || (qd.length>=3 && (c.phone||"").replace(/\D/g,"").includes(qd));
}
function wireClientOpen(){
  main.querySelectorAll("[data-copen]").forEach(el => el.onclick = () => { S.clientId = el.dataset.copen; S.view="client"; render(); });
}
function renderClients(){
  const match = c => !S.clientSearch || clientMatches(c, S.clientSearch);
  let h = `<button class="btn-ghost btn" style="width:auto;padding:9px 16px;margin:0 0 12px" id="backBtn">← Back</button>
  <div class="searchrow"><input id="cq" placeholder="Search name, phone, email or address" value="${esc(S.clientSearch)}"></div>
  <div class="card"><h3>Add a client</h3>
  <label>Name</label><input id="cName"><label>Phone</label><input id="cPhone"><label>Email</label><input id="cEmail"><label>Address</label><input id="cAddr">
  <button class="btn btn-navy" id="cAdd">Add Client</button></div>`;
  const list = [...S.clients].filter(match).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  if (!list.length) h += `<div class="card" style="text-align:center;padding:24px"><p>${S.clientSearch ? "No clients match your search." : "No clients yet."}</p></div>`;
  for (const c of list)
    h += `<div class="docrow"><div data-copen="${c.id}" style="flex:1;cursor:pointer"><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.phone||"")} ${esc(clientAddr(c))}</div></div><button class="del" style="width:42px;padding:9px 0;background:#FDECEC;border:1px solid #F3B8B8;border-radius:9px;color:#8B0000;font-weight:bold" data-cdel="${c.id}">✕</button></div>`;
  main.innerHTML = h;
  $("#backBtn").onclick = () => { S.view="list"; render(); };
  const cq = $("#cq"); if (cq) cq.oninput = e => { S.clientSearch = e.target.value; renderClients(); const nq=$("#cq"); nq.focus(); nq.setSelectionRange(nq.value.length,nq.value.length); };
  $("#cAdd").onclick = async () => { const n = $("#cName").value.trim(); if (!n) return alert("Enter a name."); await addDoc(collection(db,"clients"), {name:n, phone:$("#cPhone").value, email:$("#cEmail").value, address:$("#cAddr").value}); };
  wireClientOpen();
  main.querySelectorAll("[data-cdel]").forEach(b => b.onclick = async () => { if (confirm("Delete this client?")) await deleteDoc(doc(db,"clients", b.dataset.cdel)); });
}
function renderClientDetail(){
  const c = S.clients.find(x=>x.id===S.clientId);
  if (!c) { S.view="clients"; return renderClients(); }
  const digits = (c.phone||"").replace(/\D/g,"");
  let wa = digits; if (wa.length===10) wa = "1"+wa;
  let h = `<button class="btn-ghost btn" style="width:auto;padding:9px 16px;margin:0 0 12px" id="backBtn">← Back to Clients</button>
  <div class="card"><h3>${esc(c.name||"Client")}</h3>
    ${clientAddr(c)?`<p style="margin:6px 0">${esc(clientAddr(c))}</p>`:""}
    ${c.phone?`<p style="margin:6px 0">📞 <a href="tel:${esc(digits)}">${esc(c.phone)}</a></p>`:""}
    ${c.email?`<p style="margin:6px 0">✉️ ${esc(c.email)}</p>`:""}
    <div style="display:flex;gap:8px;margin-top:10px">
      ${c.phone?`<a class="btn btn-navy" style="flex:1;width:auto;margin-top:0;text-align:center;text-decoration:none" href="tel:${esc(digits)}">📞 Call</a>`:""}
      ${digits?`<a class="btn btn-navy" style="flex:1;width:auto;margin-top:0;text-align:center;text-decoration:none" href="https://wa.me/${wa}" target="_blank">💬 WhatsApp</a>`:""}
    </div>
    <button class="btn btn-gold" id="cReview">⭐ Ask for a Google review</button>
    <button class="btn btn-red" id="cNewInv">＋ New Invoice</button>
    <button class="btn btn-ghost" id="cNewEst">＋ New Estimate</button>
  </div>
  <div class="yearhead"><span>History</span></div>`;
  const nameLc = (c.name||"").toLowerCase();
  const docs = S.docs.filter(d => d.clientId===c.id || (!d.clientId && nameLc && (d.clientName||"").toLowerCase()===nameLc));
  docs.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.number||"").localeCompare(a.number||""));
  if (!docs.length) h += `<div class="card" style="text-align:center;padding:24px"><p>No invoices or estimates yet.</p></div>`;
  for (const d of docs){
    const t = totals(d), st = docStatus(d);
    h += `<div class="docrow" data-open="${d.id}"><div style="flex:1"><div class="nm">${esc(d.number||"")}</div><div class="sub">${d.type==="invoice"?"Invoice":"Estimate"} · ${fmtDate(d.date)}</div><span class="badge ${badgeCls(st)}">${st}</span></div><div style="text-align:right"><div class="amt">${money(t.total)}${t.balance>0&&t.balance<t.total?`<div class="sub" style="color:var(--red)">Bal ${money(t.balance)}</div>`:""}</div><button data-copy="${d.id}" style="margin-top:6px;padding:7px 10px;background:#fff;border:1px solid var(--navy);border-radius:8px;color:var(--navy);font-weight:bold;font-size:12.5px">🧾 New invoice from this</button></div></div>`;
  }
  const sq = (Array.isArray(c.sqHistory) ? [...c.sqHistory] : []).sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  if (sq.length){
    h += `<div class="yearhead"><span>Past jobs (from Square)</span><span>${sq.length} job${sq.length===1?"":"s"}</span></div>`;
    sq.forEach((j,ix) => {
      h += `<div class="docrow"><div style="flex:1"><div class="nm" style="font-size:15px">${esc(j.desc||"")}</div><div class="sub">${fmtDate(j.date)}</div></div><div style="text-align:right"><div class="amt">${money(j.amount)}</div><button data-sqmake="${ix}" style="margin-top:6px;padding:7px 10px;background:#fff;border:1px solid var(--navy);border-radius:8px;color:var(--navy);font-weight:bold;font-size:12.5px">🧾 Make invoice</button></div></div>`;
    });
  }
  main.innerHTML = h;
  $("#backBtn").onclick = () => { S.view="clients"; render(); };
  $("#cNewInv").onclick = () => newDocForClient("invoice", c);
  $("#cNewEst").onclick = () => newDocForClient("estimate", c);
  $("#cReview").onclick = () => askReview(c.name, c.phone);
  main.querySelectorAll("[data-copy]").forEach(b => b.onclick = e => { e.stopPropagation(); const dd = S.docs.find(x=>x.id===b.dataset.copy); if (dd) copyDocToInvoice(dd); });
  main.querySelectorAll("[data-sqmake]").forEach(b => b.onclick = () => { const j = sq[+b.dataset.sqmake]; if (j) newInvoiceFromSqJob(c, j); });
  main.querySelectorAll("[data-open]").forEach(el => el.onclick = () => { const dd = S.docs.find(x=>x.id===el.dataset.open); if (dd) S.tab = dd.type==="invoice" ? "invoices" : "estimates"; S.editId = el.dataset.open; S.view="editor"; S.editSeg="edit"; render(); });
}
function renderItems(){
  let h = `<button class="btn-ghost btn" style="width:auto;padding:9px 16px;margin:0 0 12px" id="backBtn">← Back</button><div class="card"><h3>Add a service</h3>
  <label>Service name</label><input id="iName"><label>Usual price $</label><input id="iPrice" type="number" step="0.01" min="0">
  <button class="btn btn-navy" id="iAdd">Add Service</button></div>`;
  for (const i of S.items)
    h += `<div class="docrow"><div><div class="nm">${esc(i.name)}</div><div class="sub">${money(i.price)}</div></div><button style="width:42px;padding:9px 0;background:#FDECEC;border:1px solid #F3B8B8;border-radius:9px;color:#8B0000;font-weight:bold" data-idel="${i.id}">✕</button></div>`;
  main.innerHTML = h;
  $("#backBtn").onclick = () => { S.view="list"; render(); };
  $("#iAdd").onclick = async () => { const n = $("#iName").value.trim(); if (!n) return alert("Enter a service name."); await addDoc(collection(db,"items"), {name:n, price:+$("#iPrice").value||0}); };
  main.querySelectorAll("[data-idel]").forEach(b => b.onclick = async () => { if (confirm("Delete this service?")) await deleteDoc(doc(db,"items", b.dataset.idel)); });
}
function renderSettings(){
  const st = S.settings;
  main.innerHTML = `<button class="btn-ghost btn" style="width:auto;padding:9px 16px;margin:0 0 12px" id="backBtn">← Back</button>
  <div class="card"><h3>Business Info</h3>
  <label>Business name</label><input id="sName" value="${esc(st.bizName)}">
  <label>Address</label><input id="sAddr" value="${esc(st.bizAddr)}">
  <label>Phone</label><input id="sPhone" value="${esc(st.bizPhone)}">
  <label>Email</label><input id="sEmail" value="${esc(st.bizEmail)}">
  <label>Website</label><input id="sWeb" value="${esc(st.bizWeb)}">
  <label>Licence line</label><input id="sLic" value="${esc(st.bizLicence)}">
  <label>Tax rate % (HST)</label><input id="sTax" type="number" step="0.1" value="${st.taxRate}">
  <label>Payment methods line</label><input id="sPay" value="${esc(st.payLine)}">
  <label>Guarantee text (prints on every document)</label><textarea id="sGuar" rows="8">${esc(st.guarantee)}</textarea>
  <button class="btn btn-red" id="sSave">Save Settings</button></div>`;
  $("#backBtn").onclick = () => { S.view="list"; render(); };
  $("#sSave").onclick = async () => {
    const upd = {bizName:$("#sName").value, bizAddr:$("#sAddr").value, bizPhone:$("#sPhone").value, bizEmail:$("#sEmail").value, bizWeb:$("#sWeb").value, bizLicence:$("#sLic").value, taxRate:+$("#sTax").value||13, payLine:$("#sPay").value, guarantee:$("#sGuar").value};
    await updateDoc(doc(db,"settings","main"), upd); Object.assign(S.settings, upd); alert("Settings saved.");
  };
}
function newExpense(){ editExpense(null); }
function editExpense(id){
  const e = id ? S.expenses.find(x=>x.id===id) : {date: todayStr(), desc:"", amount:0, category:"General"};
  if (!e) return;
  main.innerHTML = `<button class="btn-ghost btn" style="width:auto;padding:9px 16px;margin:0 0 12px" id="backBtn">← Back</button>
  <div class="card"><h3>${id?"Edit":"New"} Expense</h3>
  <label>Date</label><input type="date" id="eDate" value="${e.date||todayStr()}">
  <label>Description</label><input id="eDesc" value="${esc(e.desc||"")}" placeholder="Parts, gas, tools…">
  <label>Amount $</label><input id="eAmt" type="number" step="0.01" min="0" value="${e.amount||""}">
  <label>Category</label><select id="eCat">${["General","Parts","Gas","Tools","Vehicle","Insurance","Other"].map(c=>`<option ${e.category===c?"selected":""}>${c}</option>`).join("")}</select>
  <button class="btn btn-red" id="eSave">Save Expense</button>
  ${id?'<button class="btn btn-ghost" id="eDel">Delete</button>':""}</div>`;
  $("#backBtn").onclick = () => render();
  $("#eSave").onclick = async () => {
    const data = {date:$("#eDate").value, desc:$("#eDesc").value, amount:+$("#eAmt").value||0, category:$("#eCat").value};
    if (id) await updateDoc(doc(db,"expenses", id), data); else await addDoc(collection(db,"expenses"), data);
    render();
  };
  const del = $("#eDel"); if (del) del.onclick = async () => { if (confirm("Delete this expense?")) { await deleteDoc(doc(db,"expenses", id)); render(); } };
}
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
